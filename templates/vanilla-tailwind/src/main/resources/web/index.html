<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My App</title>
  <!--
    panamaview.js is the client half of the bridge. The framework stages it into this directory at
    startup, so it always matches the panamaview on your classpath. Reference it; do not copy it
    into the project — a copy goes stale silently.

    The leading slash matters. A relative "panamaview.js" resolves against the page's own
    directory, so it works from /index.html and breaks the moment a client-side route adds a path
    segment.
  -->
  <script src="/panamaview.js"></script>
  <link rel="stylesheet" href="tailwind.css">
</head>

<body class="h-full bg-slate-950 text-slate-200 antialiased">
  <main class="mx-auto flex max-w-2xl flex-col gap-6 px-8 py-12">
    <header>
      <h1 class="text-2xl font-semibold tracking-tight text-slate-50">My App</h1>
      <p class="mt-1 text-sm text-slate-400">
        A panamaview app: a Java process, a plain HTML page, and a JSON bridge between them.
      </p>
    </header>

    <section class="rounded-xl border border-slate-800 bg-slate-900/60 p-4">
      <h2 class="mb-2 text-xs font-semibold uppercase tracking-widest text-slate-500">
        Java → JavaScript
      </h2>
      <pre id="from-java"
           class="rounded-lg bg-slate-950 p-3 font-mono text-xs leading-relaxed text-slate-400 overflow-x-auto">waiting for Java…</pre>
    </section>

    <section class="rounded-xl border border-slate-800 bg-slate-900/60 p-4">
      <h2 class="mb-2 text-xs font-semibold uppercase tracking-widest text-slate-500">
        JavaScript → Java
      </h2>
      <button id="call"
              class="rounded-md border border-slate-700 bg-slate-800 px-3.5 py-1.5 text-sm text-slate-200 transition-colors hover:border-sky-500 hover:text-sky-400">
        Call Java
      </button>
      <pre id="result"
           class="mt-3 rounded-lg bg-slate-950 p-3 font-mono text-xs text-sky-400">—</pre>
    </section>
  </main>
</body>
<script src="app.js"></script>
</html>
