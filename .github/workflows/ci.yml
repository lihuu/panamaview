name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    name: shell scripts
    # No macOS, no GraalVM, no Node: these check decisions, not builds, so they run on the cheapest
    # runner available and finish in seconds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not apt's. Ubuntu's shellcheck is 0.9.0 and the newest release is 0.11.0, and they
      # do not agree: 0.11 dropped SC2002 and SC2015, so two real findings passed locally and
      # failed here. A lint that depends on which version the runner happens to carry is a lint
      # whose verdict means nothing. The pin is what makes "clean locally" and "clean in CI" the
      # same claim.
      - name: Lint
        run: |
          set -eu
          version=0.11.0
          url="https://github.com/koalaman/shellcheck/releases/download/v$version/shellcheck-v$version.linux.x86_64.tar.xz"
          curl -fsSL "$url" | tar -xJ
          bin="$PWD/shellcheck-v$version/shellcheck"
          "$bin" --version
          "$bin" scripts/*.sh npm/scripts/*.sh \
                 templates/*/*.sh templates/*/scripts/*.sh

      # deploy-private.sh itself cannot run here — it needs credentials this repository must not
      # hold. Everything it decides before uploading anything can be checked without them, and that
      # is the part where being wrong publishes an artifact to the wrong repository.
      - name: Check the deploy script's decisions
        run: ./scripts/verify-deploy.sh

  framework:
    name: framework — the artifact carries no application
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # GraalVM rather than a plain JDK 25, and this is now only about which JDK: no step in this
      # job builds a native image. It used to say the packaging checks below build the scaffolder
      # as a native binary; the scaffolder is npm/cli.js, JavaScript, and the two checks below stop
      # at `mvn` and `./run.sh`. What is left is the reason release.yml gives for the same action —
      # it is the proven way to get this JDK — and the version, which is the one the framework is
      # developed and verified against. The native image is built in the templates job, which is
      # where the templates' own build-native.sh runs.
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and install the framework
        run: mvn -q install -DskipTests

      # The demo used to live in this tree, so the published jar shipped the demo's classes and
      # its pages: a consumer's classpath acquired an application it never asked for, and the
      # framework's own declared entry point was the demo's main(). Nothing else here would
      # notice if that came back — the jar still builds, and every template still works.
      - name: The jar is a library and nothing else
        run: |
          set -eu
          # The name is derived from the pom, never written here: a hardcoded version survives
          # every check that does not care about it, then disappears when the version is bumped,
          # and a guard that cannot find its subject fails on its own arithmetic rather than on
          # the thing it exists to catch. This was written with 0.1.0 in it and broke at 0.2.0.
          #
          # And read from the framework's own pom, not the root one: the root is the parent of the
          # reactor, so its version is a different fact. Reading it here would have kept working
          # for as long as the two numbers happened to agree, then pointed at a jar that is not
          # there — the same shape of failure the paragraph above is about.
          version="$(python3 -c "import re;print(re.search(r'<version>([^<]+)</version>', open('framework/pom.xml').read()).group(1))")"
          jar="framework/target/panamaview-$version.jar"
          [ -f "$jar" ] || { echo "::error::no $jar — the framework did not build"; exit 1; }

          # Listed into the module's own target/, not the repository root's: the framework is a
          # module now, and the root has no target/ of its own to write into. That is what failed
          # the first time this ran — "line 15: target/jar-contents.txt: No such file or
          # directory", which reads like a shell problem and is really a path from the old layout.
          contents="framework/target/jar-contents.txt"
          jar tf "$jar" > "$contents"
          cat "$contents"

          fail=0
          for pattern in '^panamaview/App' '^panamaview/macos/Main' '^demo/' '^web/'; do
            if grep -qE "$pattern" "$contents"; then
              echo "::error::the framework jar carries an application: $pattern"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]
          echo "no application classes, no pages: the jar is the framework"

      # The other half of the claim, and the half that fails quietly: that the jar is still
      # usable from outside its own tree. This is the demo's headless mode — it stages its own
      # assets plus the framework's client bridge and exits without loading AppKit, which is the
      # only end-to-end check that can run on a runner with no window server.
      - name: A consumer can build and stage a page
        run: (cd demo-app && JAVA_OPTS=-Dpanamaview.check=true ./run.sh)

      # The scaffolder handed to someone through npm or Homebrew carries the framework with it,
      # because `io.github.lihuu:panamaview` is not on Maven Central and a generated project that
      # cannot resolve its one dependency is the failure this whole packaging exists to prevent.
      # This checks the wiring and then builds a generated project against an empty repository, so
      # "it resolved from the bundled copy" is observed rather than assumed.
      - name: A packaged scaffolder can build a project with nothing configured
        run: ./scripts/verify-scaffold-library.sh

      # The npm package end to end: pack, install into a throwaway prefix, generate, and build
      # against an empty repository and settings that declare no repositories.
      - name: The npm package installs and produces a working project
        run: ./scripts/verify-npm-package.sh

  templates:
    name: ${{ matrix.template }} — template and scaffolded project, JVM + native
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # Each template is verified in its own job, so one failing does not hide the other.
        template: [vanilla, vanilla-tailwind, react, vue, angular]
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          # Matches the environment the framework is developed and verified against:
          # GraalVM CE 25, which carries native-image.
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Toolchain
        run: |
          java --version
          native-image --version
          mvn --version
          node --version || echo "node is only needed by the react template"

      # node_modules for the react template, keyed on the lockfile. Skipped for vanilla, which
      # has no frontend toolchain at all — that is the point of having both templates.
      # Tailwind's standalone binary is ~80 MB and fetched on first build. Cached separately from
      # node_modules because it is not a Node dependency at all.
      - name: Restore the Tailwind build tool
        if: matrix.template == 'vanilla-tailwind'
        uses: actions/cache@v4
        with:
          path: ~/.cache/panamaview-tailwind
          key: tailwind-${{ runner.os }}-${{ hashFiles('templates/vanilla-tailwind/scripts/build-css.sh') }}

      - name: Restore frontend dependencies
        if: matrix.template != 'vanilla' && matrix.template != 'vanilla-tailwind'
        uses: actions/cache@v4
        with:
          path: templates/${{ matrix.template }}/frontend/node_modules
          key: node-${{ runner.os }}-${{ matrix.template }}-${{ hashFiles(format('templates/{0}/frontend/package-lock.json', matrix.template)) }}

      # One script, run exactly as the README describes it: install the framework, copy the
      # template somewhere unrelated to this checkout, then take it to a native executable using
      # the template's own run.sh and build-native.sh.
      #
      # This is what stops the templates rotting. Everything it checks fails *quietly* otherwise:
      # a stale pinned version, assets listed but not embedded, an absolute asset reference that
      # works on a dev server and breaks from disk.
      - name: Verify the template end to end
        run: ./scripts/verify-templates.sh ${{ matrix.template }}

      # Then the same template again, arriving the way a user would get it: generated by the
      # scaffolder into an unrelated directory, under a name and package that stress the
      # substitution (a hyphen, and a package outside com.example so a leftover token cannot hide
      # inside a correct one).
      #
      # Both checks are needed. The template above can be perfect and the generated project still
      # be wrong, because they fail for different reasons: a stale pin is a template bug, while a
      # rename that lands in a path derived from the app name is a scaffolding bug — and the
      # residual-token check passes cleanly on that one, because every token *was* substituted.
      - name: Verify the scaffolder, generating from this template
        run: ./scripts/verify-scaffold.sh ${{ matrix.template }}

      - name: Native build log on failure
        if: failure()
        run: |
          find /var/folders /tmp -name "*-native.log" -newermt "-15 minutes" 2>/dev/null \
            -exec sh -c 'echo "--- {}"; tail -60 "{}"' \; || true
